name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # run the same gate on PRs (incl. dependabot's) so a red check never reaches main
  pull_request:
    branches: [main]
  workflow_dispatch:
  # monthly rebuild so security.txt's rolling Expires never lapses without a commit
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

# one concurrent deploy, never cancelled mid-flight; PR checks get their own
# per-ref group so a push to a PR supersedes its own stale run and nothing else
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # single source of truth, shared with local dev — CI and laptop can't drift.
          # `.npmrc` sets engine-strict, so a dep that outgrows this Node fails at
          # `npm ci` with a readable message instead of mid-test (see PR #19).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck + biome + vitest — block deploy on a red gate
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' # PRs only need the gate, not an artifact
        with:
          path: dist
          # default excludes dotfiles → drops .well-known/ and .nojekyll from the deploy
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
